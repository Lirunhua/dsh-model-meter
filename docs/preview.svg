<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Usage Panel 0.6.1 — compact provider usage preview</title>
<desc id="desc">Unofficial DeepSeek Harness plugin with ChatGPT subscription quotas, GLM and Kimi plans, and DeepSeek account or API balances. The compact GPT card uses fictional percentages, credits and reset times.</desc>
