<text x="64" y="845" font-size="13" fill="#8d98a8">Usage Panel 0.6.1 · Unofficial DeepSeek Harness community plugin. All values and reset times are fictional.</text>
<text x="64" y="871" font-size="12" fill="#98a2b1">Usage describes the configured provider account, not the selected model's individual consumption.</text>
