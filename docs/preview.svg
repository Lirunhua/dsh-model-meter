<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Model Meter 0.5.2 — simplified selected-provider preview</title>
<desc id="desc">Unofficial DeepSeek Harness plugin. Only Kimi Code quotas are visible for a selected Kimi example model. All percentages and reset times are fictional example data.</desc>
<defs><filter id="shadow" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#273956" flood-opacity=".055"/></filter></defs>
<rect width="1400" height="900" fill="#f5f7fa"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="64" y="95" font-size="43" font-weight="750" letter-spacing="-1.5" fill="#202b3f">Model Meter</text>
<text x="64" y="136" font-size="21" fill="#68758a">A simpler view of the provider you are using.</text>
<rect x="1010" y="59" width="326" height="34" rx="17" fill="#fff0cf"/>
<text x="1173" y="81" text-anchor="middle" font-size="12" font-weight="650" fill="#8a5d00">EXAMPLE DATA · UNOFFICIAL PLUGIN</text>
<text x="64" y="247" font-size="14" font-weight="700" letter-spacing="1.7" fill="#6272bb">ONE SELECTED MODEL. ONE PROVIDER.</text>
<text x="64" y="313" font-size="43" font-weight="700" letter-spacing="-1.4" fill="#202b3f">Only the usage</text>
<text x="64" y="367" font-size="43" font-weight="700" letter-spacing="-1.4" fill="#202b3f">you need.</text>
<text x="64" y="420" font-size="19" fill="#68758a">Choose a model in Harness.</text>
<text x="64" y="451" font-size="19" fill="#68758a">See its provider's quota or API balance.</text>
<path d="M64 499H666" stroke="#e0e6ee"/>
<text x="64" y="536" font-size="14" fill="#8490a2">Selected example model</text>
<rect x="64" y="559" width="112" height="43" rx="8" fill="#fff" stroke="#dbe2ec"/>
<text x="120" y="586" text-anchor="middle" font-size="15" fill="#68758a">GLM</text>
<rect x="188" y="559" width="112" height="43" rx="8" fill="#e9edff" stroke="#9ca9ec"/>
<text x="244" y="586" text-anchor="middle" font-size="15" font-weight="600" fill="#3f52b3">Kimi</text>
<rect x="312" y="559" width="142" height="43" rx="8" fill="#fff" stroke="#dbe2ec"/>
<text x="383" y="586" text-anchor="middle" font-size="15" fill="#68758a">DeepSeek</text>
<text x="64" y="655" font-size="16" fill="#8490a2">Used percentage. Progress. Reset time.</text>
<text x="64" y="685" font-size="16" fill="#8490a2">No other account cards or session statistics.</text>
<rect x="778" y="192" width="558" height="575" rx="16" fill="#fff" stroke="#dde4ed" filter="url(#shadow)"/>
<path d="M778 246H1336" stroke="#e7ebf1"/>
<circle cx="806" cy="220" r="4" fill="#7d8bcc"/>
<text x="820" y="225" font-size="14" font-weight="600" fill="#4d5a73">Usage</text>
<text x="804" y="289" font-size="19" font-weight="650" fill="#202b3f">Selected model usage</text>
<rect x="1244" y="266" width="66" height="29" rx="6" fill="#fff" stroke="#dbe2ec"/>
<text x="1277" y="285" text-anchor="middle" font-size="11" fill="#68758a">Refresh</text>
<text x="804" y="325" font-size="14" fill="#8490a2">Selected model: Kimi example</text>
<text x="804" y="354" font-size="13" fill="#8490a2">Account-level quota / balance · refreshes every 60s</text>
<path d="M804 380H1310" stroke="#e7ebf1"/>
<text x="804" y="414" font-size="17" font-weight="650" fill="#202b3f">Kimi Code</text>
<text x="804" y="457" font-size="15" fill="#59687f">5-hour window</text>
<text x="1310" y="457" text-anchor="end" font-size="15" font-weight="600" fill="#2c3b54">18% used</text>
<rect x="804" y="474" width="506" height="7" rx="3.5" fill="#edf0f5"/>
<rect x="804" y="474" width="91.08" height="7" rx="3.5" fill="#6b7fd4"/>
<text x="804" y="509" font-size="13" fill="#8490a2">Example reset: Jan 1, 2099, 10:30 UTC</text>
<text x="804" y="534" font-size="13" fill="#8490a2">Resets in 2h 15m</text>
<text x="804" y="583" font-size="15" fill="#59687f">7-day window</text>
<text x="1310" y="583" text-anchor="end" font-size="15" font-weight="600" fill="#2c3b54">7% used</text>
<rect x="804" y="600" width="506" height="7" rx="3.5" fill="#edf0f5"/>
<rect x="804" y="600" width="35.42" height="7" rx="3.5" fill="#6b7fd4"/>
<text x="804" y="635" font-size="13" fill="#8490a2">Example reset: Jan 4, 2099, 00:00 UTC</text>
<text x="804" y="660" font-size="13" fill="#8490a2">Resets in 3d 16h</text>
<text x="804" y="704" font-size="12" fill="#97a1b0">Example updated: 08:15</text>
<text x="804" y="738" font-size="10" letter-spacing=".5" font-weight="650" fill="#a1843e">ILLUSTRATIVE PREVIEW · FICTIONAL DATA</text>
<path d="M64 812H1336" stroke="#e2e7ef"/>
<text x="64" y="845" font-size="13" fill="#8d98a8">Model Meter 0.5.2 · Unofficial DeepSeek Harness community plugin. All values and reset times are fictional.</text>
<text x="64" y="871" font-size="12" fill="#98a2b1">Usage describes the configured provider account, not the selected model's individual consumption.</text>
</g>
